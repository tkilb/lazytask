name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"

      - name: Install taskwarrior (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y taskwarrior

      - name: Install taskwarrior (macOS)
        if: runner.os == 'macOS'
        run: brew install task

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
